name: build-windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        Configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install .NET Framework 4.6.1 targeting pack
        shell: pwsh
        run: choco install netfx-4.6.1-devpack -y --no-progress

      - name: Restore and build
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration ${{ matrix.Configuration }} -Platform x64

      - name: Stage runtime dependencies
        if: matrix.Configuration == 'Release'
        shell: pwsh
        run: |
          Copy-Item packages\Microsoft.Bcl.HashCode.1.1.1\lib\net461\Microsoft.Bcl.HashCode.dll DistPackages\Windows\ -Force
          Copy-Item packages\System.Buffers.4.6.0\lib\net462\System.Buffers.dll DistPackages\Windows\ -Force
          Copy-Item packages\System.Memory.4.6.0\lib\net462\System.Memory.dll DistPackages\Windows\ -Force

      - name: Smoke test DWSIM startup
        if: matrix.Configuration == 'Release'
        shell: pwsh
        run: |
          $exe = "DistPackages\Windows\DWSIM.exe"
          if (!(Test-Path $exe)) { throw "missing $exe" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "DWSIM exited during startup (code $($p.ExitCode))" }
          Write-Host "DWSIM started (pid $($p.Id))"
          Stop-Process -Id $p.Id -Force

      - name: Upload build output
        if: matrix.Configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: h2sim-windows-x64
          path: DistPackages/Windows/
          if-no-files-found: error

      - name: Package Windows single-file
        if: matrix.Configuration == 'Release'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          ./scripts/package-windows.ps1

      - name: Upload Windows package
        if: matrix.Configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: h2sim-windows-package
          path: release/windows/H2sim-*-windows-x64.exe
          if-no-files-found: error

      - name: Signal map tests
        if: matrix.Configuration == 'Release'
        shell: pwsh
        run: |
          Copy-Item DWSIM.H2sim.Io.Tests\bin\x64\Release\* DistPackages\Windows\ -Recurse -Force
          Push-Location DistPackages\Windows
          try {
            .\DWSIM.H2sim.Io.Tests.exe
            if ($LASTEXITCODE -ne 0) { throw "signal map tests failed ($LASTEXITCODE)" }
          } finally {
            Pop-Location
          }

      - name: OpenPLC v4 Modbus master probe
        if: matrix.Configuration == 'Release'
        shell: pwsh
        run: |
          git init .openplc-runtime
          git -C .openplc-runtime remote add origin https://github.com/autonomy-logic/openplc-runtime.git
          git -C .openplc-runtime fetch --depth 1 origin 9fb5e1a29b574806f5aea3a4e78202c7a5d658ee
          git -C .openplc-runtime checkout --detach FETCH_HEAD
          python -m pip install -r .openplc-runtime/core/src/drivers/plugins/python/modbus_master/requirements.txt
          python -m pip install -r .openplc-runtime/core/src/drivers/plugins/python/opcua/requirements.txt
          Push-Location DistPackages\Windows
          try {
            .\DWSIM.H2sim.Io.Tests.exe --openplc-modbus-probe (Resolve-Path ..\..\.openplc-runtime)
            if ($LASTEXITCODE -ne 0) { throw "OpenPLC v4 Modbus master probe failed ($LASTEXITCODE)" }
            .\DWSIM.H2sim.Io.Tests.exe --openplc-opcua-probe (Resolve-Path ..\..\.openplc-runtime)
            if ($LASTEXITCODE -ne 0) { throw "OpenPLC v4 OPC UA server probe failed ($LASTEXITCODE)" }
          } finally {
            Pop-Location
          }

      - name: Dynamics headless smoke test
        if: matrix.Configuration == 'Release'
        shell: pwsh
        env:
          H2SIM_OPCUA_TEST: "1"
        run: |
          pip install asyncua
          $log = Join-Path $env:TEMP "h2sim-opcua.log"
          $err = "$log.err"
          $server = Start-Process python -ArgumentList "-u", "tests/opcua/mock_server.py" -NoNewWindow -PassThru -RedirectStandardOutput $log -RedirectStandardError $err
          Start-Sleep -Seconds 6
          Get-Content $log
          if (Test-Path $err) { Get-Content $err }
          if ($server.HasExited) { throw "mock OPC UA server exited with $($server.ExitCode)" }
          if (-not (Select-String -Path $log -Pattern "ready" -Quiet)) { throw "mock OPC UA server did not start" }
          Get-NetTCPConnection -LocalPort 4840 -State Listen -ErrorAction SilentlyContinue | Select-Object LocalAddress, LocalPort, State

          try {
            Copy-Item DWSIM.H2sim.Io\bin\x64\Release\* DistPackages\Windows\ -Force
            Copy-Item packages\Microsoft.Bcl.HashCode.1.1.1\lib\net461\Microsoft.Bcl.HashCode.dll DistPackages\Windows\ -Force
            Copy-Item DWSIM.Automation.Dynamics.Tests\bin\x64\Release\* DistPackages\Windows\ -Recurse -Force
            Push-Location DistPackages\Windows
            try {
              .\DWSIM.Automation.Dynamics.Tests.exe "samples\Dynamic Simulation - Water Tank Level Control.dwxmz" --shadow-report shadow-report
              if ($LASTEXITCODE -ne 0) { throw "dynamics smoke test failed ($LASTEXITCODE)" }
            } finally {
              Pop-Location
            }
          } finally {
            if (Test-Path $err) { "--- mock server stderr ---"; Get-Content $err }
            Get-Content $log
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: Generate plant samples
        if: matrix.Configuration == 'Release'
        shell: pwsh
        run: |
          Push-Location DistPackages\Windows
          try {
            .\DWSIM.Automation.Dynamics.Tests.exe --generate-samples generated-samples
            if ($LASTEXITCODE -ne 0) { throw "sample generation failed ($LASTEXITCODE)" }
          } finally {
            Pop-Location
          }

      - name: Upload plant samples
        if: matrix.Configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: h2sim-plant-samples
          path: DistPackages/Windows/generated-samples/*.dwxmz
          if-no-files-found: error

      - name: Upload shadow deviation evidence
        if: always() && matrix.Configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: h2sim-shadow-deviation
          path: DistPackages/Windows/shadow-report/*.csv
          if-no-files-found: error

  openplc-compiler:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Compile three-loop PLC fixture with OpenPLC Editor
        run: bash tests/openplc/compile_editor_fixture.sh

      - name: Compile OPC UA three-loop fixture with OpenPLC Editor
        run: bash tests/openplc/compile_editor_fixture.sh tests/openplc/h2sim-three-loop-opcua

      - name: Run three-loop OpenPLC Runtime v4 virtual bench
        run: bash tests/openplc/run_three_loop_bench.sh

      - name: Run impaired Modbus closed-loop bench (V-5.1.6)
        run: bash tests/openplc/run_three_loop_bench.sh tests/openplc/h2sim-three-loop v5.1.6-impaired-three-loop.csv 20 1

      - name: Run OPC UA three-loop parity bench
        run: bash tests/openplc/run_opcua_three_loop_bench.sh

      - name: Upload three-loop closed-loop evidence
        uses: actions/upload-artifact@v4
        with:
          name: h2sim-openplc-three-loop
          path: tests/reports/closed-loop/v5.1.*-three-loop*.csv
          if-no-files-found: error
