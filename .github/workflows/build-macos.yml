name: build-macos

on:
  push:
  workflow_dispatch:
    inputs:
      probe:
        description: "Only run the GTK3 runtime probe"
        type: boolean
        default: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.probe != true }}
    # macos-15-intel is the current x64 standard runner. Mono 6.12 is x86_64,
    # so no Rosetta is needed.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Mono 6.12
        shell: bash
        run: |
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/mono.pkg" \
            "https://download.mono-project.com/archive/6.12.0/macos-10-universal/MonoFramework-MDK-6.12.0.206.macos10.xamarin.universal.pkg"
          sudo installer -pkg "$RUNNER_TEMP/mono.pkg" -target /

      - name: Show toolchain
        shell: bash
        run: |
          export PATH="/Library/Frameworks/Mono.framework/Versions/Current/bin:$PATH"
          mono --version | head -2
          msbuild -version | head -2
          nuget help 2>&1 | sed -n '1,2p'

      - name: Build macOS desktop
        shell: bash
        run: |
          export PATH="/Library/Frameworks/Mono.framework/Versions/Current/bin:$PATH"
          bash scripts/build-macos.sh

      - name: Package macOS dmg
        shell: bash
        run: |
          export PATH="/Library/Frameworks/Mono.framework/Versions/Current/bin:$PATH"
          bash scripts/package-macos.sh

      - name: Upload macOS dmg
        uses: actions/upload-artifact@v4
        with:
          name: h2sim-macos-dmg
          path: release/macos/H2sim-*-macos-x64.dmg
          if-no-files-found: error

      - name: Run dynamics tests
        shell: bash
        run: |
          export PATH="/Library/Frameworks/Mono.framework/Versions/Current/bin:$PATH"
          bash scripts/test-macos.sh

  probe-gtk3:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe == true }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Mono 6.12
        shell: bash
        run: |
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/mono.pkg" \
            "https://download.mono-project.com/archive/6.12.0/macos-10-universal/MonoFramework-MDK-6.12.0.206.macos10.xamarin.universal.pkg"
          sudo installer -pkg "$RUNNER_TEMP/mono.pkg" -target /

      - name: Build macOS desktop
        shell: bash
        run: |
          export PATH="/Library/Frameworks/Mono.framework/Versions/Current/bin:$PATH"
          bash scripts/build-macos.sh

      - name: Install GTK3
        shell: bash
        run: |
          brew install gtk+3 gtksourceview3
          fc-cache -f >/dev/null 2>&1 || true

      - name: Force the Gtk3 renderer
        shell: bash
        run: |
          for dir in "$HOME/Documents/DWSIM Application Data" \
                     "$HOME/Documents/Documents/DWSIM Application Data"; do
            mkdir -p "$dir"
            printf '[PlatformRenderers]\nMac=Gtk3\n' > "$dir/dwsim_newui.ini"
          done

      - name: Start DWSIM with GTK3
        shell: bash
        run: |
          export PATH="/Library/Frameworks/Mono.framework/Versions/Current/bin:$PATH"
          export DYLD_LIBRARY_PATH="/usr/local/lib:${DYLD_LIBRARY_PATH:-}"
          export GTK_DATA_PREFIX="/usr/local"
          export XDG_DATA_DIRS="/usr/local/share:${XDG_DATA_DIRS:-}"
          # Avoid CoreText's Apple Color Emoji image path, which crashes while
          # Pango/Cairo renders a fallback glyph on the macOS runner.
          export PANGOCAIRO_BACKEND="fontconfig"
          export H2SIM_MAC_RENDERER="Gtk3"
          cd DWSIM.UI.Desktop/bin/Release
          mono DWSIM.UI.Desktop.exe > "$RUNNER_TEMP/gtk3.log" 2>&1 &
          pid=$!
          sleep 30
          if kill -0 "$pid" 2>/dev/null; then
            echo "GTK3 PROBE: process alive after 30 s"
          else
            echo "GTK3 PROBE: process exited"
          fi
          screencapture -x "$RUNNER_TEMP/gtk3.png" || true
          kill "$pid" 2>/dev/null || true
          sleep 2
          tail -100 "$RUNNER_TEMP/gtk3.log"

      - name: Package GTK3 dmg
        shell: bash
        run: |
          export PATH="/Library/Frameworks/Mono.framework/Versions/Current/bin:$PATH"
          bash scripts/package-macos.sh

      - name: Run the packaged app
        shell: bash
        run: |
          export PATH="/Library/Frameworks/Mono.framework/Versions/Current/bin:$PATH"
          MNT="$RUNNER_TEMP/h2sim-mnt"
          hdiutil attach -nobrowse -mountpoint "$MNT" release/macos/H2sim-*-macos-x64.dmg
          "$MNT/H2sim.app/Contents/MacOS/H2sim" > "$RUNNER_TEMP/package.log" 2>&1 &
          pid=$!
          sleep 30
          if kill -0 "$pid" 2>/dev/null; then
            echo "PACKAGE PROBE: process alive after 30 s"
          else
            echo "PACKAGE PROBE: process exited"
          fi
          cat > "$RUNNER_TEMP/windows.swift" <<'SWIFT'
          import CoreGraphics
          let opts: CGWindowListOption = [.optionAll, .excludeDesktopElements]
          if let list = CGWindowListCopyWindowInfo(opts, kCGNullWindowID) as? [[String: Any]] {
            for w in list {
              let owner = w[kCGWindowOwnerName as String] as? String ?? ""
              let name = w[kCGWindowName as String] as? String ?? ""
              print("WINDOW: \(owner) | \(name)")
            }
          }
          SWIFT
          swift "$RUNNER_TEMP/windows.swift" > "$RUNNER_TEMP/windows.log" 2>&1 || true
          if grep -qiE 'h2sim|dwsim|mono' "$RUNNER_TEMP/windows.log"; then
            echo "WINDOW PROBE: found the app window"
          else
            echo "WINDOW PROBE: no matching window"
          fi
          cat "$RUNNER_TEMP/windows.log"
          kill "$pid" 2>/dev/null || true
          sleep 2
          tail -100 "$RUNNER_TEMP/package.log"
          hdiutil detach "$MNT" || true

      - name: Bundle GTK3 and run without system libs
        shell: bash
        run: |
          set -euo pipefail
          brew install dylibbundler
          MNT="$RUNNER_TEMP/bundle-mnt"
          APP="$RUNNER_TEMP/bundle-app/H2sim.app"
          rm -rf "$RUNNER_TEMP/bundle-app" "$MNT"
          mkdir -p "$RUNNER_TEMP/bundle-app" "$MNT"
          hdiutil attach -nobrowse -mountpoint "$MNT" release/macos/H2sim-*-macos-x64.dmg
          cp -R "$MNT/H2sim.app" "$RUNNER_TEMP/bundle-app/"
          hdiutil detach "$MNT"
          BUNDLE="$APP/Contents/MonoBundle"
          chmod -R u+w "$APP"
          mkdir -p "$BUNDLE/lib"
          GTK_SOURCE="$(python3 -c 'import os; print(os.path.realpath("/usr/local/lib/libgtk-3.0.dylib"))')"
          cp "$GTK_SOURCE" "$BUNDLE/lib/libgtk-3.0.dylib"
          dylibbundler -cd -b -of -x "$BUNDLE/lib/libgtk-3.0.dylib" \
            -d "$BUNDLE/lib" -p "@loader_path" -s /usr/local/lib
          # Eto/GtkSharp P/Invokes the unversioned names; dylibbundler copies
          # libfoo-X.Y.dylib, so add the aliases the runtime asks for.
          for alias in libgdk_pixbuf-2.0 libgobject-2.0 libglib-2.0 libgio-2.0 \
                       libgmodule-2.0 libpango-1.0 libpangocairo-1.0 libatk-1.0; do
            src="$(ls "$BUNDLE/lib/${alias}"*.dylib 2>/dev/null | head -1 || true)"
            if [[ -n "$src" ]]; then
              ln -sf "$(basename "$src")" "$BUNDLE/lib/${alias}.dylib"
            fi
          done
          cp -R /usr/local/lib/gtk-3.0 "$BUNDLE/lib/" || true
          cp -R /usr/local/lib/gdk-pixbuf-2.0 "$BUNDLE/lib/" || true
          # The pixbuf loader .so files also link against Homebrew libs. Bundle
          # each one next to itself so the cache can load PNG/JPEG/SVG.
          for loader in "$BUNDLE"/lib/gdk-pixbuf-2.0/2.10.0/loaders/*.so; do
            [[ -f "$loader" ]] || continue
            dylibbundler -b -of -x "$loader" \
              -d "$BUNDLE/lib/gdk-pixbuf-2.0/2.10.0/loaders" \
              -p "@loader_path" -s /usr/local/lib || true
          done
          mkdir -p "$BUNDLE/share" "$BUNDLE/etc"
          cp -R /usr/local/share/gtk-3.0 "$BUNDLE/share/" || true
          cp -R /usr/local/share/themes "$BUNDLE/share/" || true
          cp -R /usr/local/share/icons "$BUNDLE/share/" || true
          cp -R /usr/local/share/glib-2.0 "$BUNDLE/share/" || true
          cp -R /usr/local/etc/gtk-3.0 "$BUNDLE/etc/" || true
          cp -R /usr/local/etc/fonts "$BUNDLE/etc/" || true
          if command -v gdk-pixbuf-query-loaders >/dev/null; then
            GDK_PIXBUF_MODULEDIR="$BUNDLE/lib/gdk-pixbuf-2.0/2.10.0/loaders" \
              gdk-pixbuf-query-loaders "$BUNDLE"/lib/gdk-pixbuf-2.0/2.10.0/loaders/*.so \
              > "$BUNDLE/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache" \
              2> "$RUNNER_TEMP/query-loaders.log" || true
          fi
          echo "PIXBUF LOADERS:"
          ls -1 "$BUNDLE/lib/gdk-pixbuf-2.0/2.10.0/loaders" 2>/dev/null || true
          echo "QUERY LOG:"
          cat "$RUNNER_TEMP/query-loaders.log" 2>/dev/null || true
          echo "CACHE PNG ENTRIES: $(grep -c 'image/png' "$BUNDLE/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache" 2>/dev/null || echo 0)"
          echo "PNG LOADER DEPS:"
          otool -L "$BUNDLE/lib/gdk-pixbuf-2.0/2.10.0/loaders/libpixbufloader-png.so" 2>/dev/null | head -12 || true
          echo "BUNDLED LIBS: $(ls "$BUNDLE/lib" | wc -l)"
          sudo mv /usr/local/lib /usr/local/lib.h2sim-hidden
          trap 'sudo mv /usr/local/lib.h2sim-hidden /usr/local/lib || true' EXIT
          cd "$BUNDLE"
          export H2SIM_MAC_RENDERER=Gtk3
          export PANGOCAIRO_BACKEND=fontconfig
          export DYLD_LIBRARY_PATH="$BUNDLE/lib"
          export GTK_DATA_PREFIX="$BUNDLE"
          export XDG_DATA_DIRS="$BUNDLE/share:/usr/share"
          export GDK_PIXBUF_MODULE_FILE="$BUNDLE/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"
          export GDK_PIXBUF_MODULEDIR="$BUNDLE/lib/gdk-pixbuf-2.0/2.10.0/loaders"
          export GSETTINGS_SCHEMA_DIR="$BUNDLE/share/glib-2.0/schemas"
          /Library/Frameworks/Mono.framework/Versions/Current/bin/mono DWSIM.UI.Desktop.exe \
            > "$RUNNER_TEMP/bundled.log" 2>&1 &
          pid=$!
          sleep 30
          if kill -0 "$pid" 2>/dev/null; then
            echo "BUNDLED PROBE: process alive after 30 s"
          else
            echo "BUNDLED PROBE: process exited"
          fi
          swift "$RUNNER_TEMP/windows.swift" > "$RUNNER_TEMP/bundled-windows.log" 2>&1 || true
          cat "$RUNNER_TEMP/bundled-windows.log"
          kill "$pid" 2>/dev/null || true
          sleep 2
          sudo mv /usr/local/lib.h2sim-hidden /usr/local/lib || true
          trap - EXIT
          tail -100 "$RUNNER_TEMP/bundled.log"

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-gtk3-probe
          path: |
            ${{ runner.temp }}/gtk3.log
            ${{ runner.temp }}/gtk3.png
            ${{ runner.temp }}/package.log
            ${{ runner.temp }}/windows.log
            ${{ runner.temp }}/bundled.log
            ${{ runner.temp }}/bundled-windows.log
          if-no-files-found: warn
